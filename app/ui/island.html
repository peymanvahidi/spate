<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spate island</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/island.css">
</head>
<body>
  <div class="fake-menubar preview-only" aria-hidden="true">
    <span class="fm-left"><b>Brave Browser</b><span>File</span><span>Edit</span><span>View</span></span>
    <span class="fm-notch"></span>
    <span class="fm-right">Fri 24 Oct 10:41</span>
  </div>
  <div class="island dark-scope" id="island" tabindex="0" role="region" aria-label="Active downloads">
    <i class="ear left" aria-hidden="true"></i><i class="ear right" aria-hidden="true"></i>
    <div class="clip">
    <div class="wings" aria-hidden="true">
      <div class="wing wing-l" id="wing-l"></div>
      <div class="wing wing-r num" id="wing-r"></div>
    </div>
    <div class="band" aria-hidden="true">
      <span class="band-l" id="band-l"></span>
      <span class="band-r num" id="band-r"></span>
    </div>
    <div class="rows" id="rows" role="list"></div>
    </div>
  </div>
  <script type="module" src="js/island.js"></script>
</body>
</html>
