[workspace]
resolver = "2"
members = [
    "crates/spate-proto",
    "crates/spate-core",
    "crates/spate-cli",
    "crates/spate-host",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
spate-proto = { path = "crates/spate-proto" }
spate-core = { path = "crates/spate-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
