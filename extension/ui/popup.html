<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Spate</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-32.png" width="18" height="18" alt="">
    <strong>Spate</strong>
    <span id="status" class="status"><span class="dot"></span><span id="status-text">Connecting…</span></span>
    <button id="options" class="icon-btn secondary" title="Settings" aria-label="Settings">⚙︎</button>
  </header>
  <div id="notice" class="notice" hidden></div>
  <main>
    <h2>Videos on this page</h2>
    <ul id="list"></ul>
    <p id="empty" class="empty muted" hidden>No videos detected yet. Start playing one and reopen this menu.</p>
    <p id="drm" class="empty warn" hidden>This page uses protected (DRM) video, which Spate doesn't download.</p>
  </main>
  <template id="row">
    <li class="item">
      <div class="thumb"><img alt=""><span class="ph">▶</span><span class="playing" hidden>Playing now</span></div>
      <div class="info">
        <div class="title"></div>
        <div class="meta"></div>
        <div class="msg" hidden></div>
      </div>
      <button class="dl">Download</button>
    </li>
  </template>
  <script type="module" src="popup.js"></script>
</body>
</html>
